set -g mouse on
setw -g mode-keys vi
bind-key -t vi-copy 'v' begin-selection
bind-key -t vi-copy 'y' copy-pipe "xclip -sel clip -i"

set-window-option -g window-status-current-bg red
set -g history-limit 10000

set -g status-bg black 
set -g status-fg white

rename-session "sgo"
# spliting window to 5 window
split-window -v
select-pane -t 0
split-window -h
select-pane -t 2
split-window -h
select-pane -t 3
split-window -v

select-pane -t 0
send-keys 'python /home/pi/GUIraspberrypi/execution/immortal_upload_MA.py' C-m
pipe-pane -o -t 0 'cat >> /home/pi/Desktop/logfoldertmux/tmuxlog_#I-#P'

select-pane -t 1
send-keys 'python /home/pi/GUIraspberrypi/execution/immortal_upload_UI.py' C-m
pipe-pane -o -t 1 'cat >> /home/pi/Desktop/logfoldertmux/tmuxlog_#I-#P'

select-pane -t 4
send-keys 'python /home/pi/GUIraspberrypi/execution/immortal_upload_QR.py' C-m
pipe-pane -o -t 4 'cat >> /home/pi/Desktop/logfoldertmux/tmuxlog_#I-#P'

select-pane -t 3
send-keys 'python /home/pi/GUIraspberrypi/execution/io_monitoring.py' C-m
pipe-pane -o -t 3 'cat >> /home/pi/Desktop/logfoldertmux/tmuxlog_#I-#P'

select-pane -t 2
send-keys 'python /home/pi/GUIraspberrypi/execution/uploader.py' C-m
pipe-pane -o -t 2 'cat >> /home/pi/Desktop/logfoldertmux/tmuxlog_#I-#P'



